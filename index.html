<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Color Strike</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
<div id="score">0</div>
<div id="color-indicator"></div>
<div id="combo"></div>
<div id="color-label">&#9679; red</div>
</div>
<div id="start-screen">
<h1>Color Strike</h1>
<div class="sub">Match background color to reveal obstacles<br>Swipe to dodge</div>
<div class="mechanics">&#9679; Obstacles dangerous only when colors match<br>&#9679; Tap to change background color<br>&#9679; Swipe left/right to dodge</div>
<div class="tap-btn">Tap to play</div>
</div>
<div id="game-over">
<h1>Game Over</h1>
<div class="final" id="final-score">Score: 0</div>
<div class="best" id="best-score">Best: 0</div>
<button id="restart-btn">Play Again</button>
</div>
<script src="game.js"></script>
</body>
</html>
